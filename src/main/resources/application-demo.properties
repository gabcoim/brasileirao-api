spring.application.name=brasileirao-demo

# No modo demo, a aplicacao usa um banco temporario que vive na memoria.
spring.datasource.url=jdbc:h2:mem:brasileirao-demo;MODE=PostgreSQL;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
spring.datasource.username=sa
spring.datasource.password=
spring.datasource.driver-class-name=org.h2.Driver

# Cria as tabelas ao iniciar e as remove quando a aplicacao e encerrada.
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.show-sql=false

# Estas configuracoes satisfazem a validacao da aplicacao, mas nao sao usadas:
# o endpoint de importacao e o client externo ficam desativados no perfil demo.
api-football.base-url=https://v3.football.api-sports.io
api-football.key=nao-utilizada-no-modo-demo
app.security.admin.username=demo
app.security.admin.password=nao-utilizada-no-modo-demo
